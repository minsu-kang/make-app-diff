name: Renovate PR Enhancer
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

concurrency:
  group: enhance-dependency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: |
      github.event.pull_request.user.login == 'make-renovate[bot]' &&
      (github.actor == 'make-renovate[bot]' || !contains(github.actor, '[bot]')) &&
      contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies/ai-analysed') &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies/to-implement') &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies/ai-analysis-skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: integromat/actions/renovate-analyze-pr@v1
        with:
          aws_role_arn: ${{ vars.BEDROCK_ROLE_TO_ASSUME }}
          datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
          max_turns: '60'

  implement:
    if: |
      github.event.action == 'labeled' &&
      github.event.label.name == 'dependencies/to-implement' &&
      contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      github.event.pull_request.user.login == 'make-renovate[bot]' &&
      (github.actor == 'make-renovate[bot]' || !contains(github.actor, '[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }} # required so the push lands on the PR branch

      - uses: integromat/actions/renovate-implement-pr@v1
        with:
          aws_role_arn: ${{ vars.BEDROCK_ROLE_TO_ASSUME }}
          datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
          max_turns: '60'

  dependencies-gate:
    needs: [analyze]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Evaluate dependency impact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels -q '[.labels[].name]')
          echo "Current labels: $labels"
          if ! echo "$labels" | jq -e 'contains(["dependencies"])' > /dev/null; then
            echo "Not a dependency PR — gate passes"
            exit 0
          fi
          if echo "$labels" | jq -e '(contains(["dependencies/no-impact"]) or contains(["dependencies/final-review"]) or contains(["dependencies/ai-analysis-skipped"])) | not' > /dev/null; then
            echo "::error::Dependency PR requires a terminal dependency-analysis label to merge"
            exit 1
          fi
