name: Context file refresher
on:
  workflow_dispatch:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: context-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-if-needed:
    if: >-
      !contains(github.actor, '[bot]') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.user.type == 'User')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    timeout-minutes: 3 # three times the average; avoid burning credits when stuck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: integromat/actions/context-refresher@v1
        with:
          aws_role_arn: ${{ vars.BEDROCK_ROLE_TO_ASSUME }}
          datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
