sonar.projectKey=make-app-diff
sonar.projectName=MakeDiff

sonar.sources=src
sonar.exclusions=**/__tests__/**,src/e2e/**,**/*.d.ts

sonar.tests=src
sonar.test.inclusions=**/__tests__/**,src/e2e/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-integration/lcov.info

# Findings that are accepted on purpose. NOSONAR comments are ignored by this server, so they live here.
# An entry hides its rule for the whole file, so new findings of these rules in these files need a manual check.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11

# The taint analysis does not know assertPathSegment, sanitizePath and basename. Every name, version and file path
# is checked by them before it reaches fs or execFile, and the integration tests cover the rejections.
sonar.issue.ignore.multicriteria.e1.ruleKey=tssecurity:S2083
sonar.issue.ignore.multicriteria.e1.resourceKey=src/main/ipc-handlers.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=tssecurity:S6350
sonar.issue.ignore.multicriteria.e2.resourceKey=src/main/ipc-handlers.ts

# IpmClient builds every request URL from a fixed base URL (the host is one of two dropdown values) plus segments that
# pass assertPathSegment and encodeURIComponent. The taint analysis flags any URL that is built from a parameter.
sonar.issue.ignore.multicriteria.e7.ruleKey=tssecurity:S8476
sonar.issue.ignore.multicriteria.e7.resourceKey=src/main/services/ipm-client.ts
sonar.issue.ignore.multicriteria.e8.ruleKey=tssecurity:S5144
sonar.issue.ignore.multicriteria.e8.resourceKey=src/main/services/ipm-client.ts

# powershell.exe is found through PATH for the Windows clipboard; whoever can change PATH already runs code as the user.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e3.resourceKey=src/main/ipc-handlers.ts

# Mouse affordances next to a keyboard path that already exists: the search inputs drive their result lists with the
# arrow and Enter keys, the version timeline has the From and To selects, and a dialog backdrop that closes on a click
# also closes on Escape and through the close button. role="presentation" would clear the rule but raises S6819.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e4.resourceKey=src/renderer/components/DownloadModal.tsx
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e5.resourceKey=src/renderer/components/Sidebar.tsx
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e6.resourceKey=src/renderer/components/VersionTimeline.tsx
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e9.resourceKey=src/renderer/App.tsx
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e10.resourceKey=src/renderer/components/Settings.tsx
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e11.resourceKey=src/renderer/components/VersionSelector.tsx

sonar.links.homepage=https://github.com/integromat/make-app-diff
sonar.links.scm=https://github.com/integromat/make-app-diff
